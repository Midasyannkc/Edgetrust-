syntax = "proto3";

package edgetrust.v1;

option go_package = "edgetrust/proto";

// TransactionEvent is the wire contract every producer must satisfy.
// Versioned explicitly so a schema change is a deliberate, reviewable act,
// not a silent break downstream.
message TransactionEvent {
  string event_id = 1;
  string account_id = 2;
  string device_id = 3;
  double amount = 4;
  string currency = 5;
  double lat = 6;
  double lon = 7;
  int64 event_timestamp_ms = 8;
  string merchant_category = 9;
}

message ScoreRequest {
  TransactionEvent event = 1;
}

message ScoreResponse {
  string event_id = 1;
  double risk_score = 2;       // 0.0 to 1.0
  bool flagged = 3;
  repeated string reasons = 4;  // which features drove the score
  int64 scored_at_ms = 5;
}

// Production interface. The gateway exposing this is generated by protoc
// with grpc-go; see scoring_service/README.md for why the local dev build
// in this repo runs the same scoring logic over plain HTTP/JSON instead.
service FraudScorer {
  rpc Score(ScoreRequest) returns (ScoreResponse);
}

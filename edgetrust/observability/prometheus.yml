# Prometheus scrape configuration for EdgeTrust's scoring service.
#
# The Go service in this repo exposes /healthz but not yet a /metrics
# endpoint (kept out to keep the local dev harness minimal). In production
# this would be added via the standard prometheus/client_golang exporter,
# scraped per the config below.

scrape_configs:
  - job_name: 'edgetrust-scoring-service'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: ['edgetrust']
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: edgetrust-scoring
        action: keep

---
# Alert rules: the two conditions that matter most for a real-time fraud
# scorer are latency SLO breach (the whole point of building this instead
# of a batch job) and feature-store unavailability (a fail-open risk: if
# Redis is down, every request silently loses its two strongest features).

groups:
  - name: edgetrust_alerts
    rules:
      - alert: ScoringLatencyP99High
        expr: histogram_quantile(0.99, rate(edgetrust_score_latency_seconds_bucket[5m])) > 0.2
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "EdgeTrust scoring p99 latency above 200ms SLO"

      - alert: FeatureStoreUnavailable
        expr: rate(edgetrust_feature_store_errors_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Feature store errors detected — scores may be computed without velocity/geo-jump features"

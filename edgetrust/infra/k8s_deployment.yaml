apiVersion: apps/v1
kind: Deployment
metadata:
  name: edgetrust-scoring-service
  labels:
    app: edgetrust-scoring
spec:
  replicas: 3
  selector:
    matchLabels:
      app: edgetrust-scoring
  template:
    metadata:
      labels:
        app: edgetrust-scoring
    spec:
      containers:
        - name: scoring-service
          image: edgetrust/scoring-service:latest
          ports:
            - containerPort: 8080
          env:
            - name: REDIS_ADDR
              value: "edgetrust-feature-store.cache.amazonaws.com:6379"
            - name: MODEL_WEIGHTS_PATH
              value: "/app/model_weights.json"
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: edgetrust-scoring-service
spec:
  selector:
    app: edgetrust-scoring
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: edgetrust-scoring-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: edgetrust-scoring-service
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
